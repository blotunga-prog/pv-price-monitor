name: Daily PV price monitor

on:
  schedule:
    # 05:00 UTC = 07:00 Poland during CEST, 06:00 during CET.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ComparePV monitor
        run: python monitor.py

      - name: Commit price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          if git diff --cached --quiet; then
            echo "No price-history changes."
          else
            git commit -m "Update PV price history"
            git push
     
          fi

